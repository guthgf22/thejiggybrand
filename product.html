<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>JIGGY</title>
  <meta name="description" content="JIGGY — gece mesaisi için takılar.">
  <meta name="theme-color" content="#0a0908">
  <meta property="og:locale" content="tr_TR">
  <meta property="og:image" content="https://thejiggybrand.vercel.app/assets/img/og.jpg">
  <meta property="og:url" content="https://thejiggybrand.vercel.app/product.html">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..100,400..900&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif:ital@1&display=swap">
  <link rel="modulepreload" href="assets/js/config.js">
  <link rel="modulepreload" href="assets/js/i18n.js">
  <link rel="modulepreload" href="assets/js/products.js">
  <link rel="modulepreload" href="assets/js/images.js">
  <link rel="modulepreload" href="assets/js/cart.js">
  <link rel="modulepreload" href="assets/js/core.js">
  <link rel="modulepreload" href="assets/js/cards.js">
  <link rel="modulepreload" href="assets/js/product.js">
  <link rel="stylesheet" href="assets/vendor/lenis.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <script>
    document.documentElement.classList.add('js');
    // The weighing scale opens only the first page of a visit (or a tap on the logo): other pages hide it before the first paint.
    try { if (sessionStorage.getItem('jiggy.session') && !sessionStorage.getItem('jiggy.scale')) document.documentElement.classList.add('no-loader'); } catch (e) { /* ignore */ }
    // style.css sets --ink. Without it the stylesheet never arrived (a dropped request, or a broken cached copy in
    // an in-app browser) and the page would show as bare HTML: fetch a fresh copy before anything is drawn.
    if (!getComputedStyle(document.documentElement).getPropertyValue('--ink')) {
      document.write('<link rel="stylesheet" href="assets/css/style.css?retry=' + Date.now() + '">');
    }
  </script>
</head>
<body data-page="product">
  <div class="loader" aria-hidden="true">
    <div class="loader__scale">
      <div class="loader__plate"></div>
      <div class="loader__row">
        <span class="loader__key">M</span>
        <div class="lcd-panel">
          <span class="lcd"><span class="lcd__ghost">8.88</span><span class="lcd__val">0.00</span></span>
          <span class="lcd__unit">g</span>
        </div>
        <span class="loader__key">T</span>
      </div>
    </div>
    <p class="loader__msg" data-i18n="loader.msg">Vibe tartılıyor</p>
  </div>
  <main id="main" class="pdp" data-pdp></main>
  <div data-footer></div>

  <script src="assets/vendor/gsap.min.js"></script>
  <script src="assets/vendor/ScrollTrigger.min.js"></script>
  <script src="assets/vendor/SplitText.min.js"></script>
  <script src="assets/vendor/CustomEase.min.js"></script>
  <script src="assets/vendor/lenis.min.js"></script>
  <script type="module" src="assets/js/product.js"></script>
</body>
</html>
